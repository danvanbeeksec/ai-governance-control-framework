purpose: >-
  Trace the public Agent Baseline draft to the existing independent common-control
  architecture. Source identifiers are references only and do not become a parallel
  control authority.
interpretation:
  authority: data/controls.yaml remains the sole control authority.
  adoption: Apply existing risk tier and autonomy facts when selecting and scaling controls.
  later_maturity: Multidimensional agent assurance classification is optional and is not required by this crosswalk.
  source_status: Reassess the crosswalk when Agent Baseline changes or leaves draft status.

