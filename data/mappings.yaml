schema_version: "1.0"
description: >-
  High-confidence external-framework mappings for the independent AI control library.
  A control may have zero mappings. Absence of a mapping does not reduce the control's
  validity as an internal requirement or good practice.

allowed_categories: [requirement, guideline]
allowed_bases: [source_supported, inferred]
publication_rule: >-
  Only mappings assessed as high confidence are included. Source-supported means an
  identified source crosswalk or authoritative provision directly supports the mapping.
  Inferred means the mapping was independently reasoned from authoritative framework text.

mappings:
  - {control_id: AI-GOV-001, framework: ISO-IEC-42001, edition: "2023", reference: "5.3; A.3.2", category: requirement, basis: source_supported, confidence: high, rationale: "Directly addresses assigned AI roles, responsibilities, and authority."}
